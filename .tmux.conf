set -g default-terminal "tmux-256color"
set -g default-shell "/bin/zsh"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable true color support and undercurl
set -as terminal-overrides ",*:Tc"

# Disable vim-tmux-navigator default binding for C-\ so it doesn't conflict with prefix
set -g @vim_navigator_mapping_prev ""

# Set leader/prefix to Ctrl-backslash
set -g prefix 'C-\'
unbind C-b
bind-key 'C-\' send-prefix

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Splits open in current directory
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in current working directory
bind c new-window -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf!"

# Resize panes with repeatable keys
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize/toggle zoom pane
bind -r m resize-pane -Z

# Enable mouse mode
set -g mouse on

# Vi mode for copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi "v" send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi "y" send -X copy-selection-and-cancel # copy text with "y" and exit

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Increase scrollback buffer history limit
set -g history-limit 100000

# Focus events enabled for terminals that support them
set -g focus-events on

# List of tmux plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect" # persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" # automatically saves sessions for you every 15 minutes
set -g @plugin "fabioluciano/tmux-tokyo-night"

set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
