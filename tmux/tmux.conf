# Agent-first tmux configuration, adapted from ~/dev/dots/zellij/config.kdl.
#
# Keys are tmux/Herdr shaped: agent TUIs own the keyboard, and Ctrl-b (with
# Ctrl-Space fallback) is the leader. No Alt chords are bound without prefix,
# so Alt+h/j/k/l, Alt+n, Alt+o, etc. always reach the agent TUI underneath.
#
# Leader (Ctrl-b, fallback Ctrl-Space) map:
#   c new window              n / p next / prev window      1..9 go to window
#   v split right             - split down                  x close pane
#   X close window            z zoom                        Tab cycle pane
#   h j k l / arrows focus    , rename window               r resize mode
#   [ scrollback              s session tree                w / b / i spaces navigator
#   N new space               W rename space                o next attention
#   a agents selector         e edit scrollback             q / d detach
#   Ctrl-b literal Ctrl-b     R reload config

# ---------------------------------------------------------------------------
# Terminal, input & scrollback
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB,wezterm:RGB,alacritty:RGB,ghostty:RGB"
set -g escape-time 0
set -g focus-events on
set -s extended-keys on
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 2

# 1-based windows and panes to match Zellij's 1..9 tab keys.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse + copy-on-select (OSC 52 clipboard + vi copy-mode).
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Native attention signals (feed tmux-spaces fallback alongside hooks/@spaces_*).
setw -g monitor-activity on
set -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# ---------------------------------------------------------------------------
# Leader / prefix
# ---------------------------------------------------------------------------
set -g prefix C-b
set -g prefix2 C-Space
bind C-b send-prefix

# ---------------------------------------------------------------------------
# Keybindings (matching zellij/config.kdl)
# ---------------------------------------------------------------------------

# Windows (Zellij tabs).
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9
bind X kill-window
bind , command-prompt -I "#W" "rename-window -- '%%'"

# Spaces (tmux sessions).
# N (Shift-n) is bound by tmux-spaces.tmux to `tmux-spaces popup --new`.
bind W command-prompt -I "#S" "rename-session -- '%%'"

# Panes.
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z
bind Tab select-pane -t :.+
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Resize mode (prefix + r enters resize key-table; r / Esc / Enter exits).
bind r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Left resize-pane -L 5 \; switch-client -T resize
bind -T resize Down resize-pane -D 5 \; switch-client -T resize
bind -T resize Up resize-pane -U 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize
bind -T resize r switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root

# Attention / Spaces / Agents.
# w -> Spaces navigator, a -> Agents selector, N -> New space (bound by plugin).
bind b display-popup -E -w 86% -h 82% -b rounded "tmux-spaces popup"
bind i display-popup -E -w 86% -h 82% -b rounded "tmux-spaces popup"
bind o run-shell "tmux-spaces next"

# Edit scrollback in $EDITOR (matches Zellij's EditScrollback on `e`).
bind e run-shell 'f=$(mktemp /tmp/tmux-scrollback-XXXXXX.txt); tmux capture-pane -p -S -50000 > "$f"; tmux display-popup -E -w 90% -h 90% -b rounded "${VISUAL:-${EDITOR:-nvim}} \"$f\"; rm -f \"$f\""'

# Scrollback, session tree, detach, reload.
bind [ copy-mode
bind s choose-tree -Zs
bind q detach-client
bind d detach-client
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Theme: Catppuccin Mocha (matching zellij/config.kdl & tmux-spaces TUI)
# ---------------------------------------------------------------------------
# Crust=#11111b Mantle=#181825 Base=#1e1e2e Surface0=#313244 Surface1=#45475a
# Overlay0=#6c7086 Subtext0=#a6adc8 Text=#cdd6f4 Lavender=#b4befe Blue=#89b4fa
# Green=#a6e3a1 Yellow=#f9e2af Red=#f38ba8

set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#b4befe,fg=#11111b,bold] #S #[bg=#181825,fg=#b4befe] "
set -g status-right "#{spaces_status} #[fg=#6c7086]│ #[fg=#a6adc8]%H:%M "

# Window tabs with attention markers (tab_markers).
setw -g window-status-separator " "
setw -g window-status-style "bg=#181825,fg=#a6adc8"
setw -g window-status-format " #I:#W#{?window_bell_flag, #[fg=#f38ba8]●,}#{?window_activity_flag, #[fg=#89b4fa]•,} "
setw -g window-status-current-style "bg=#313244,fg=#cdd6f4,bold"
setw -g window-status-current-format " #[fg=#b4befe]#I#[fg=#cdd6f4]:#W "

# Pane borders & frame markers (showing @spaces_state / @spaces_app when set).
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#b4befe"
set -g pane-border-status top
set -g pane-border-format "#{?#{@spaces_state}, #[fg=#{?#{==:#{@spaces_state},working},#f9e2af,#{?#{==:#{@spaces_state},done},#a6e3a1,#{?#{||:#{==:#{@spaces_state},blocked},#{==:#{@spaces_state},needs_you}},#f38ba8,#{?#{||:#{==:#{@spaces_state},failed},#{==:#{@spaces_state},error}},#f38ba8,#6c7086}}}}]#{@spaces_state}#[fg=#a6adc8] #{?#{@spaces_app},#{@spaces_app},#{pane_current_command}} , #{pane_current_command} }"

# Messages, command prompt, and popup borders.
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#b4befe"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#45475a"

# ---------------------------------------------------------------------------
# tmux-spaces plugin
# ---------------------------------------------------------------------------
set -g @spaces-key 'w'
set -g @spaces-agents-key 'a'
set -g @spaces-new-key 'N'
set -g @spaces-popup-width '86%'
set -g @spaces-popup-height '82%'
set -g @spaces-border 'rounded'

run-shell "~/dev/model-router/plugins/tmux-spaces/tmux-spaces.tmux"
