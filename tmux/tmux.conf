# Agent-first tmux configuration, adapted from ~/dev/dots/zellij/config.kdl.
#
# Keys are tmux/Herdr shaped: agent TUIs own the keyboard, and Ctrl-Space is
# the only leader. No Alt chords are bound without prefix, so Alt+h/j/k/l,
# Alt+n, Alt+o, etc. always reach the agent TUI underneath.
#
# Leader (Ctrl-Space) map:
#   c new window              n / b next / back window      1..9 go to window
#   p pane cycle mode         t tab cycle mode              r resize mode
#   v split right             - split down                  x close pane
#   X close window            z zoom                        Tab cycle pane
#   h j k l / arrows focus    , rename window               s session tree
#   [ scrollback              w spaces navigator            i inbox
#   N new space               W rename space                o next attention
#   a agents selector         e edit scrollback             q / d detach
#   Ctrl-Space literal        R reload config

# ---------------------------------------------------------------------------
# Terminal, input & scrollback
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:hyperlinks,xterm-kitty:RGB:hyperlinks,wezterm:RGB:hyperlinks,alacritty:RGB,ghostty:RGB:hyperlinks"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment KITTY_WINDOW_ID
set -g escape-time 0
set -g focus-events on
set -s extended-keys on
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 2

# 1-based windows and panes to match Zellij's 1..9 tab keys.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse + copy-on-select (OSC 52 clipboard + vi copy-mode).
set -g mouse on
# Ctrl-click an OSC 8 web link to open it in the default browser.
bind -n C-MouseDown1Pane if-shell -F -t = '#{m/r:^https?://,#{mouse_hyperlink}}' {
    run-shell -b 'xdg-open #{q:mouse_hyperlink}'
} {
    send-keys -M
}
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel \; set -g @action_key 'y' \; set -g @action_label 'yanked' \; run-shell -C '#{@flash}'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; set -g @action_key 'copy' \; set -g @action_label 'yanked' \; run-shell -C '#{@flash}'

# Native attention signals (feed tmux-spaces fallback alongside hooks/@spaces_*).
setw -g monitor-activity on
set -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# ---------------------------------------------------------------------------
# Transient action marker helper (non-intrusive bottom-bar feedback)
# ---------------------------------------------------------------------------
# Increments @action_seq synchronously (0ms), refreshes the status bar, and
# clears @action_key/@action_label after 1.5s unless superseded by a newer key.
set -g @flash 'set -gF @action_seq "#{e|+:#{@action_seq},1}" ; run-shell -b "sleep 1.5; [ \"$(tmux -S #{q:socket_path} show -gqv @action_seq)\" = \"#{@action_seq}\" ] && tmux -S #{q:socket_path} set -gu @action_key \\; set -gu @action_label \\; refresh-client -S 2>/dev/null || true" ; refresh-client -S'

# ---------------------------------------------------------------------------
# Leader / prefix
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
set -g prefix2 None
bind C-Space send-prefix \; set -g @action_key 'C-Space' \; set -g @action_label 'literal' \; run-shell -C '#{@flash}'

# ---------------------------------------------------------------------------
# Keybindings (matching zellij/config.kdl)
# ---------------------------------------------------------------------------

# Windows (Zellij tabs).
bind c new-window -c "#{pane_current_path}" \; set -g @action_key 'c' \; set -g @action_label 'new tab' \; run-shell -C '#{@flash}'
bind n next-window \; set -g @action_key 'n' \; set -g @action_label 'next tab' \; run-shell -C '#{@flash}'
bind b previous-window \; set -g @action_key 'b' \; set -g @action_label 'prev tab' \; run-shell -C '#{@flash}'
bind 1 select-window -t :=1 \; set -g @action_key '1' \; set -g @action_label 'tab 1' \; run-shell -C '#{@flash}'
bind 2 select-window -t :=2 \; set -g @action_key '2' \; set -g @action_label 'tab 2' \; run-shell -C '#{@flash}'
bind 3 select-window -t :=3 \; set -g @action_key '3' \; set -g @action_label 'tab 3' \; run-shell -C '#{@flash}'
bind 4 select-window -t :=4 \; set -g @action_key '4' \; set -g @action_label 'tab 4' \; run-shell -C '#{@flash}'
bind 5 select-window -t :=5 \; set -g @action_key '5' \; set -g @action_label 'tab 5' \; run-shell -C '#{@flash}'
bind 6 select-window -t :=6 \; set -g @action_key '6' \; set -g @action_label 'tab 6' \; run-shell -C '#{@flash}'
bind 7 select-window -t :=7 \; set -g @action_key '7' \; set -g @action_label 'tab 7' \; run-shell -C '#{@flash}'
bind 8 select-window -t :=8 \; set -g @action_key '8' \; set -g @action_label 'tab 8' \; run-shell -C '#{@flash}'
bind 9 select-window -t :=9 \; set -g @action_key '9' \; set -g @action_label 'tab 9' \; run-shell -C '#{@flash}'
bind X set -g @action_key 'X' \; set -g @action_label 'close tab' \; run-shell -C '#{@flash}' \; kill-window
bind , command-prompt -I "#W" "rename-window -- '%%'"

# Spaces (tmux sessions).
# N (Shift-n) is bound by tmux-spaces.tmux to `tmux-spaces popup --new`.
bind W command-prompt -I "#S" "rename-session -- '%%'"

# Panes.
bind v split-window -h -c "#{pane_current_path}" \; set -g @action_key 'v' \; set -g @action_label 'split →' \; run-shell -C '#{@flash}'
bind - split-window -v -c "#{pane_current_path}" \; set -g @action_key '-' \; set -g @action_label 'split ↓' \; run-shell -C '#{@flash}'
bind x set -g @action_key 'x' \; set -g @action_label 'close pane' \; run-shell -C '#{@flash}' \; kill-pane
bind z resize-pane -Z \; set -g @action_key 'z' \; set -gF @action_label '#{?window_zoomed_flag,zoomed,unzoomed}' \; run-shell -C '#{@flash}'
bind Tab select-pane -t :.+ \; set -g @action_key '⇥' \; set -g @action_label 'next pane' \; run-shell -C '#{@flash}'
bind h select-pane -L \; set -g @action_key 'h' \; set -g @action_label 'pane ←' \; run-shell -C '#{@flash}'
bind j select-pane -D \; set -g @action_key 'j' \; set -g @action_label 'pane ↓' \; run-shell -C '#{@flash}'
bind k select-pane -U \; set -g @action_key 'k' \; set -g @action_label 'pane ↑' \; run-shell -C '#{@flash}'
bind l select-pane -R \; set -g @action_key 'l' \; set -g @action_label 'pane →' \; run-shell -C '#{@flash}'
bind Left select-pane -L \; set -g @action_key '←' \; set -g @action_label 'pane ←' \; run-shell -C '#{@flash}'
bind Down select-pane -D \; set -g @action_key '↓' \; set -g @action_label 'pane ↓' \; run-shell -C '#{@flash}'
bind Up select-pane -U \; set -g @action_key '↑' \; set -g @action_label 'pane ↑' \; run-shell -C '#{@flash}'
bind Right select-pane -R \; set -g @action_key '→' \; set -g @action_label 'pane →' \; run-shell -C '#{@flash}'

# Pane cycling mode (prefix + p enters pane key-table; arrows / hjkl cycle;
# Enter settles on the selected pane; Esc / Ctrl-c cancels back to original).
bind p set -wF @cycle_orig_pane "#{pane_id}" \; switch-client -T pane
unbind -T pane -a
bind -T pane h if-shell -F '#{&&:#{==:#{pane_at_left},1},#{==:#{pane_at_right},1}}' 'select-pane -t :.-' 'select-pane -L' \; switch-client -T pane
bind -T pane j if-shell -F '#{&&:#{==:#{pane_at_top},1},#{==:#{pane_at_bottom},1}}' 'select-pane -t :.+' 'select-pane -D' \; switch-client -T pane
bind -T pane k if-shell -F '#{&&:#{==:#{pane_at_top},1},#{==:#{pane_at_bottom},1}}' 'select-pane -t :.-' 'select-pane -U' \; switch-client -T pane
bind -T pane l if-shell -F '#{&&:#{==:#{pane_at_left},1},#{==:#{pane_at_right},1}}' 'select-pane -t :.+' 'select-pane -R' \; switch-client -T pane
bind -T pane Left if-shell -F '#{&&:#{==:#{pane_at_left},1},#{==:#{pane_at_right},1}}' 'select-pane -t :.-' 'select-pane -L' \; switch-client -T pane
bind -T pane Down if-shell -F '#{&&:#{==:#{pane_at_top},1},#{==:#{pane_at_bottom},1}}' 'select-pane -t :.+' 'select-pane -D' \; switch-client -T pane
bind -T pane Up if-shell -F '#{&&:#{==:#{pane_at_top},1},#{==:#{pane_at_bottom},1}}' 'select-pane -t :.-' 'select-pane -U' \; switch-client -T pane
bind -T pane Right if-shell -F '#{&&:#{==:#{pane_at_left},1},#{==:#{pane_at_right},1}}' 'select-pane -t :.+' 'select-pane -R' \; switch-client -T pane
bind -T pane Tab select-pane -t :.+ \; switch-client -T pane
bind -T pane BTab select-pane -t :.- \; switch-client -T pane
bind -T pane Enter set -wu @cycle_orig_pane \; switch-client -T root
bind -T pane Escape switch-client -T root \; if-shell -F '#{@cycle_orig_pane}' 'run-shell -C "select-pane -t #{@cycle_orig_pane}" ; set -wu @cycle_orig_pane' \; set -g @action_key 'esc' \; set -g @action_label 'reverted' \; run-shell -C '#{@flash}'
bind -T pane C-c switch-client -T root \; if-shell -F '#{@cycle_orig_pane}' 'run-shell -C "select-pane -t #{@cycle_orig_pane}" ; set -wu @cycle_orig_pane' \; set -g @action_key 'esc' \; set -g @action_label 'reverted' \; run-shell -C '#{@flash}'
bind -T pane Any switch-client -T pane

# Tab cycling mode (prefix + t enters tab key-table; arrows / hjkl cycle;
# Enter settles on the selected tab; Esc / Ctrl-c cancels back to original).
bind t set -F @cycle_orig_window "#{window_id}" \; switch-client -T tab
unbind -T tab -a
bind -T tab h previous-window \; switch-client -T tab
bind -T tab k previous-window \; switch-client -T tab
bind -T tab j next-window \; switch-client -T tab
bind -T tab l next-window \; switch-client -T tab
bind -T tab Left previous-window \; switch-client -T tab
bind -T tab Up previous-window \; switch-client -T tab
bind -T tab Down next-window \; switch-client -T tab
bind -T tab Right next-window \; switch-client -T tab
bind -T tab Tab next-window \; switch-client -T tab
bind -T tab BTab previous-window \; switch-client -T tab
bind -T tab Enter set -u @cycle_orig_window \; switch-client -T root
bind -T tab Escape switch-client -T root \; if-shell -F '#{@cycle_orig_window}' 'run-shell -C "select-window -t #{@cycle_orig_window}" ; set -u @cycle_orig_window' \; set -g @action_key 'esc' \; set -g @action_label 'reverted' \; run-shell -C '#{@flash}'
bind -T tab C-c switch-client -T root \; if-shell -F '#{@cycle_orig_window}' 'run-shell -C "select-window -t #{@cycle_orig_window}" ; set -u @cycle_orig_window' \; set -g @action_key 'esc' \; set -g @action_label 'reverted' \; run-shell -C '#{@flash}'
bind -T tab Any switch-client -T tab

# Resize mode (prefix + r enters resize key-table; r / Esc / Enter exits).
bind r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Left resize-pane -L 5 \; switch-client -T resize
bind -T resize Down resize-pane -D 5 \; switch-client -T resize
bind -T resize Up resize-pane -U 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize
bind -T resize r switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root

# Attention / Spaces / Agents.
# w -> Spaces navigator, i -> Inbox, a -> Agents selector, N -> New space (bound by plugin).
bind o run-shell "tmux-spaces next" \; set -g @action_key 'o' \; set -g @action_label 'next attn' \; run-shell -C '#{@flash}'

# Edit scrollback in $EDITOR (matches Zellij's EditScrollback on `e`).
bind e run-shell 'f=$(mktemp /tmp/tmux-scrollback-XXXXXX.txt); tmux capture-pane -p -S -50000 > "$f"; tmux display-popup -E -w 90% -h 90% -b rounded "${VISUAL:-${EDITOR:-nvim}} \"$f\"; rm -f \"$f\""'

# Scrollback, session tree, detach, reload.
bind [ copy-mode
bind s choose-tree -Zs
bind q detach-client
bind d detach-client
bind R source-file ~/.config/tmux/tmux.conf \; set -g @action_key 'R' \; set -g @action_label 'reloaded' \; run-shell -C '#{@flash}'

# ---------------------------------------------------------------------------
# Theme: Catppuccin Mocha (matching zellij/config.kdl & tmux-spaces TUI)
# ---------------------------------------------------------------------------
# Crust=#11111b Mantle=#181825 Base=#1e1e2e Surface0=#313244 Surface1=#45475a
# Overlay0=#6c7086 Overlay1=#7f849c Subtext0=#a6adc8 Text=#cdd6f4
# Lavender=#b4befe Blue=#89b4fa Sapphire=#74c7ec Sky=#89dceb Teal=#94e2d5
# Green=#a6e3a1 Yellow=#f9e2af Peach=#fab387 Red=#f38ba8 Mauve=#cba6f7

# Active mode pill (status-left): keyboard-capturing modes use pastel fills.
%hidden BAR_MODE="#{?#{==:#{client_key_table},pane},#[bg=#f9e2af]#[fg=#11111b]#[bold] PANE ,#{?#{==:#{client_key_table},tab},#[bg=#a6e3a1]#[fg=#11111b]#[bold] TAB ,#{?#{==:#{client_key_table},resize},#[bg=#f38ba8]#[fg=#11111b]#[bold] RESIZE ,#{?client_prefix,#[bg=#fab387]#[fg=#11111b]#[bold] MOD ,#{?pane_in_mode,#{?#{==:#{pane_mode},copy-mode},#{?selection_active,#[bg=#cba6f7]#[fg=#11111b]#[bold] SELECT ,#[bg=#94e2d5]#[fg=#11111b]#[bold] COPY },#{?#{==:#{pane_mode},tree-mode},#[bg=#cba6f7]#[fg=#11111b]#[bold] TREE ,#[bg=#89dceb]#[fg=#11111b]#[bold] MODE }},}}}}}"
# Passive window/pane states (status-left): muted zoom pill + safety sync pill.
%hidden BAR_STATE="#{?window_zoomed_flag,#[bg=#313244]#[fg=#74c7ec]#[bold] ⤢ ZOOM ,}#{?pane_synchronized,#[bg=#f38ba8]#[fg=#11111b]#[bold] SYNC ,}"
# Contextual dimmed key hints while a mode/prefix is active; otherwise transient
# one-shot action badge (empty when idle so the bar stays uncluttered).
%hidden BAR_ACTION="#{?#{@action_label},#[bg=#313244]#[fg=#b4befe]#[bold] #{@action_key} #[fg=#a6adc8]#[nobold]#{@action_label} #[bg=#181825]#[fg=#cdd6f4]  ,}"
%hidden BAR_HINTS="#{?#{==:#{client_key_table},pane},#[fg=#a6adc8]hjkl/⇥#[fg=#6c7086] cycle · #[fg=#a6adc8]↵#[fg=#6c7086] keep · #[fg=#a6adc8]esc#[fg=#6c7086] cancel#[fg=#cdd6f4]  ,#{?#{==:#{client_key_table},tab},#[fg=#a6adc8]hjkl/⇥#[fg=#6c7086] cycle · #[fg=#a6adc8]↵#[fg=#6c7086] keep · #[fg=#a6adc8]esc#[fg=#6c7086] cancel#[fg=#cdd6f4]  ,#{?#{==:#{client_key_table},resize},#[fg=#a6adc8]hjkl#[fg=#6c7086] resize · #[fg=#a6adc8]↵/r/esc#[fg=#6c7086] done#[fg=#cdd6f4]  ,#{?client_prefix,#[fg=#a6adc8]v/-#[fg=#6c7086] split · #[fg=#a6adc8]c#[fg=#6c7086] tab · #[fg=#a6adc8]p/t/r#[fg=#6c7086] mode · #[fg=#a6adc8]z#[fg=#6c7086] zoom · #[fg=#a6adc8][#[fg=#6c7086] copy · #[fg=#a6adc8]w#[fg=#6c7086] spaces#[fg=#cdd6f4]  ,#{?pane_in_mode,#{?#{==:#{pane_mode},copy-mode},#{?selection_active,#[fg=#a6adc8]y#[fg=#6c7086] yank · #[fg=#a6adc8]esc#[fg=#6c7086] clear#[fg=#cdd6f4]  ,#[fg=#a6adc8]v#[fg=#6c7086] select · #[fg=#a6adc8]/#[fg=#6c7086] search · #[fg=#a6adc8]q#[fg=#6c7086] exit#[fg=#cdd6f4]  },#{?#{==:#{pane_mode},tree-mode},#[fg=#a6adc8]j/k#[fg=#6c7086] nav · #[fg=#a6adc8]↵#[fg=#6c7086] switch · #[fg=#a6adc8]x#[fg=#6c7086] kill · #[fg=#a6adc8]q#[fg=#6c7086] exit#[fg=#cdd6f4]  ,}},${BAR_ACTION}}}}}}"

set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 60
set -g status-right-length 140
set -g status-left "#[bg=#b4befe,fg=#11111b,bold] #S ${BAR_MODE}${BAR_STATE}#[bg=#181825,fg=#b4befe,nobold] "
set -g status-right "${BAR_HINTS}#{spaces_status} #[fg=#6c7086]│ #[fg=#a6adc8]%H:%M "

# Window tabs with attention & zoom markers (tab_markers).
setw -g window-status-separator " "
setw -g window-status-style "bg=#181825,fg=#7f849c"
setw -g window-status-last-style "bg=#181825,fg=#a6adc8"
setw -g window-status-activity-style "bg=#181825,fg=#a6adc8,noreverse"
setw -g window-status-bell-style "bg=#181825,fg=#f38ba8,noreverse"
setw -g window-status-format " #I:#W#{?window_zoomed_flag, #[fg=#74c7ec]⤢,}#{?window_bell_flag, #[fg=#f38ba8]●,}#{?window_activity_flag, #[fg=#89b4fa]•,} "
setw -g window-status-current-style "bg=#89b4fa,fg=#11111b,bold,noreverse"
setw -g window-status-current-format "#{?#{==:#{client_key_table},tab},#[bg=#a6e3a1]#[fg=#11111b]#[bold]#[noreverse],#[bg=#89b4fa]#[fg=#11111b]#[bold]#[noreverse]} #I:#W#{?window_zoomed_flag, ⤢,} "

# Pane borders & frame markers (showing @spaces_app when set, without status).
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "#{?#{==:#{client_key_table},pane},fg=#f9e2af,#{?#{==:#{client_key_table},tab},fg=#a6e3a1,#{?#{==:#{client_key_table},resize},fg=#f38ba8,#{?client_prefix,fg=#fab387,#{?pane_in_mode,#{?#{||:#{selection_active},#{==:#{pane_mode},tree-mode}},fg=#cba6f7,fg=#94e2d5},fg=#b4befe}}}}}"
set -g pane-border-status top
set -g pane-border-format " #{?#{@spaces_app},#{@spaces_app},#{pane_current_command}} "

# Messages, command prompt, and popup borders.
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#b4befe"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#45475a"

# ---------------------------------------------------------------------------
# tmux-spaces plugin
# ---------------------------------------------------------------------------
set -g @spaces-key 'w'
set -g @spaces-inbox-key 'i'
set -g @spaces-agents-key 'a'
set -g @spaces-new-key 'N'
set -g @spaces-popup-width '86%'
set -g @spaces-popup-height '82%'
set -g @spaces-border 'rounded'

run-shell "~/dev/model-router/plugins/tmux-spaces/tmux-spaces.tmux"
