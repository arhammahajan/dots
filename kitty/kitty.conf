# Kitty configuration ported from alacritty/default.toml
# Obsidian & muted slate-blue palette matching niri / fuzzel / quickshell / yazi / nvim

# --- Font & Ligatures ---
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Enable OpenType ligatures everywhere, expanding under the cursor while editing
disable_ligatures cursor

# --- Window & Wayland / Niri ---
background_opacity      0.55
window_padding_width    15
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no

# --- Cursor & Trailing Cursor ---
cursor                       #d8dadd
cursor_text_color            #0b0b0c
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# --- Scrollback & URLs ---
scrollback_lines      10000
strip_trailing_spaces smart
detect_urls           yes
url_color             #B7D4ED
url_style             curly

# --- Colors ---
foreground           #d8dadd
background           #0b0b0c
selection_foreground #0b0b0c
selection_background #B7D4ED

# Normal
color0  #0b0b0c
color1  #61768F
color2  #758A9B
color3  #949EA3
color4  #B2BCC4
color5  #BCC2C6
color6  #B7D4ED
color7  #d8dadd

# Bright
color8  #97989a
color9  #61768F
color10 #758A9B
color11 #949EA3
color12 #B2BCC4
color13 #BCC2C6
color14 #B7D4ED
color15 #d8dadd
