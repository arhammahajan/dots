# Router inventory and reviewed capabilities from /v1/models (2026-11-04).
# Refresh these overrides together when the router inventory changes.

[cli]
auto_update = false
use_leader = false

[models]
default = "deepseek-v4.1-flash"
default_reasoning_effort = "low"
session_summary = "deepseek-v4.1-flash"
