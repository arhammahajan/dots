[cli]
installer = "internal"
auto_update = true

[skills]
paths = ["~/dev/dots/harnesses/shared/skills"]
ignore = []
disabled = []
server_skill_dirs = []
bundled_skill_dirs = []

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[models]
default = "grok-4.7"
default_reasoning_effort = "low"

[ui]
max_thoughts_width = 120
yolo = false
compact_mode = false

[mcp_servers.agent-browser]
command = "${HOME}/.local/bin/agent-browser"
args = [
    "mcp",
    "--tools",
    "core,debug",
    "--config",
    "${HOME}/.local/share/helium-tools/agent-browser/config.json",
]
startup_timeout_sec = 60
tool_timeout_sec = 120
