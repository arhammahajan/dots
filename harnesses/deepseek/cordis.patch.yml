# Router inventory snapshot: 2026-11-04. Managed copies live in ~/.dsh/profiles/.
# Only the router holds upstream credentials. All models use Responses ingress.
- id: llm-pi-ai
  config:
    providers:
      model-router:
        displayName: Model Router
        apiKeyEnv: MODEL_ROUTER_API_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:4000/v1
        transport: sse
        compat:
          supportsDeveloperRole: false
          supportsStrictMode: false
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              high: high
              max: max
