model = "gpt-6.1-sol"
model_reasoning_effort = "high"
service_tier = "default"

[desktop]
followUpQueueMode = "steer"
external-agent-import-sync-item-types = "all"
external-agent-import-sync-enabled = true
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/arhammahajan/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/arhammahajan/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[mcp_servers.excalidraw]
command = "/opt/homebrew/bin/node"
args = ["/Users/arhammahajan/.local/share/diagram-mcp/excalidraw/node_modules/mcp-excalidraw-server/dist/index.js"]

[mcp_servers.excalidraw.env]
ENABLE_CANVAS_SYNC = "true"
EXCALIDRAW_EXPORT_DIR = "/Users/arhammahajan/.local/share/diagram-mcp/exports"
EXPRESS_SERVER_URL = "http://127.0.0.1:7311"

[mcp_servers.tldraw]
command = "/opt/homebrew/bin/node"
args = ["/Users/arhammahajan/.local/share/diagram-mcp/tldraw-launch.mjs"]

[mcp_servers.cua-driver]
command = "/home/arhammahajan/.local/bin/cua-driver"
args = ["mcp"]

[features]
hooks = true

[mcp_servers.agent-browser]
command = "/Users/arhammahajan/.local/bin/agent-browser"
args = ["mcp", "--tools", "core,debug", "--config", "/Users/arhammahajan/.local/share/helium-tools/agent-browser/config.json"]
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled_tools = [
  "agent_browser_tools_profiles",
  "agent_browser_open",
  "agent_browser_read",
  "agent_browser_snapshot",
  "agent_browser_click",
  "agent_browser_fill",
  "agent_browser_type",
  "agent_browser_press",
  "agent_browser_check",
  "agent_browser_uncheck",
  "agent_browser_select",
  "agent_browser_scroll",
  "agent_browser_wait_ms",
  "agent_browser_wait_for_selector",
  "agent_browser_wait_for_text",
  "agent_browser_wait_for_load",
  "agent_browser_screenshot",
  "agent_browser_get_text",
  "agent_browser_get_url",
  "agent_browser_get_title",
  "agent_browser_eval",
  "agent_browser_close",
  "agent_browser_back",
  "agent_browser_forward",
  "agent_browser_reload",
  "agent_browser_tab_new",
  "agent_browser_tab_list",
  "agent_browser_tab_switch",
  "agent_browser_tab_close",
  "agent_browser_highlight",
]

[mcp_servers.playwright]
command = "/opt/homebrew/bin/node"
args = ["/Users/arhammahajan/.local/share/playwright-mcp/attach-helium.mjs"]
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.browser-use]
command = "/Users/arhammahajan/.local/bin/browser-use-helium"
args = ["--mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.agent-desktop]
command = "/home/arhammahajan/.local/bin/agent-desktop"
args = ["mcp"]
