default_model = "opencode-go/deepseek-v4.1-flash"
# ~/.kimi-code/config.toml
# Runtime settings for Kimi Code.
# This file starts empty so built-in defaults can apply.
# Login will populate managed Kimi provider and model entries.
[providers.opencode-go]
base_url = "https://opencode.ai/inference/go/openai/v1"
type = "openai"
api_key_env = "OPENCODE_API_KEY"
# OpenCode Go requires x-opencode-session on every request; any stable UUID works.
custom_headers = { "x-opencode-session" = "ff1865b2-cb82-40c0-b15b-1c11595f49db" }
[models."opencode-go/deepseek-v4-pro"]
provider = "opencode-go"
model = "deepseek-v4-pro"
max_context_size = 1000000
max_output_size = 384000
capabilities = [ "always_thinking", "tool_use" ]
display_name = "DeepSeek V4 Pro (New)"
reasoning_key = "reasoning_content"
support_efforts = [ "high", "max" ]

[models."opencode-go/hy4-preview"]
provider = "opencode-go"
model = "hy4-preview"
max_context_size = 1024000
max_output_size = 64000
capabilities = [ "thinking", "tool_use" ]
display_name = "Hy4 preview"
support_efforts = [ "high" ]
off_effort = "none"

