#:schema https://yazi-rs.github.io/schemas/yazi.json
# Yazi configuration.

[mgr]
ratio = [1, 4, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [
  { run = 'nvim %s', desc = "nvim", block = true, for = "unix" },
]
